# proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=7d use_temp_path=off;

error_log /var/log/nginx/error.log error;

# log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
#                             '$status $body_bytes_sent "$http_referer" '
#                             '"$http_user_agent" "$http_x_forwarded_for"';
access_log  /var/log/nginx/access.log  main;

# 80 端口，重定向到 HTTPS（保留原 Host）
server {
  listen 80;
  server_name www.calvinhappy.com calvinhappy.com _;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name calvinhappy.com www.calvinhappy.com;
  root /usr/share/nginx/html/;

  location / {
    try_files $uri $uri.html /index.html;
  }

  location /static/ {
    expires max;
    add_header Cache-Control "public";
  }

  location /_next/ {
    expires max;
    add_header Cache-Control "public";
  }

  # 防止 favicon 请求返回 404
  location = /favicon.ico {
    log_not_found off;
    access_log off;
  }

  # 禁止对 . 文件的直接访问
  location ~ /\. {
    deny all;
  }

  error_page 404 /index.html;  # 备用处理方式

  gzip on;
  gzip_types text/html application/javascript text/css application/json;

  ssl_certificate   /etc/ssl/cert/www.calvinhappy.com.pem;
  ssl_certificate_key  /etc/ssl/cert/www.calvinhappy.com.key;
  ssl_session_timeout 5m;
  ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
  ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
  ssl_prefer_server_ciphers on;

  # rewrite ^(.*)$  https://blog.calvinhappy.com$1 permanent;
}

